name: HandPilot
options:
  bundleIdPrefix: com.handpilot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  HandPilot:
    type: application
    platform: iOS
    sources:
      - path: HandPilot
    # The plist is declared here rather than kept as a file, because XcodeGen
    # GENERATES whatever `info.path` points at and would overwrite a hand-written
    # one. Losing NSCameraUsageDescription that way makes iOS kill the app the
    # instant it touches the camera -- which looks exactly like a crash on Start.
    info:
      path: HandPilot/Info.plist
      properties:
        CFBundleDisplayName: HandPilot
        NSCameraUsageDescription: >-
          HandPilot uses the rear camera to track your hand and send the
          landmark positions to your computer.
        NSLocalNetworkUsageDescription: >-
          HandPilot accepts a connection from your computer so it can deliver
          hand tracking data.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handpilot.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
