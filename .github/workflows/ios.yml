name: Build HandPilot (unsigned IPA)

# Builds the iPhone app on GitHub's macOS runners, so no Mac is needed locally.
# The result is an UNSIGNED .ipa: sideload it with Sideloadly or AltStore, which
# signs it with your own free Apple ID on your own machine.
#
# Run it from the Actions tab ("Run workflow"), or on any push touching ios/.

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/HandPilot
        run: xcodegen generate

      # Compile before archiving. A plain build surfaces Swift errors with far
      # clearer output than an archive failure does.
      - name: Build
        working-directory: ios/HandPilot
        run: |
          set -o pipefail
          xcodebuild \
            -project HandPilot.xcodeproj \
            -scheme HandPilot \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios/HandPilot
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "no .app produced"; exit 1; fi
          echo "packaging $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry HandPilot-unsigned.ipa Payload
          ls -lh HandPilot-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HandPilot-unsigned-ipa
          path: ios/HandPilot/out/HandPilot-unsigned.ipa
          retention-days: 30
