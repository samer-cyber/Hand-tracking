name: Build iPhone app (unsigned IPA)

# Builds the iPhone app on GitHub's macOS runners, so no Mac is needed. The
# result is an UNSIGNED .ipa: sideload it with Sideloadly or AltStore, which sign
# it with your own Apple ID on your own computer. See docs/ios-build.md.
#
# Runs from the Actions tab ("Run workflow"), on pushes that touch ios/, and on
# version tags -- a tag also attaches the .ipa to that GitHub release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/HandPilot
        run: xcodegen generate

      # Compile before packaging. A plain build surfaces Swift errors with far
      # clearer output than an archive failure does.
      - name: Build
        working-directory: ios/HandPilot
        run: |
          set -o pipefail
          xcodebuild \
            -project HandPilot.xcodeproj \
            -scheme HandPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios/HandPilot
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "no .app produced"; exit 1; fi
          echo "packaging $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry HandPilot-unsigned.ipa Payload
          ls -lh HandPilot-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HandPilot-unsigned-ipa
          path: ios/HandPilot/out/HandPilot-unsigned.ipa
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/HandPilot/out/HandPilot-unsigned.ipa
