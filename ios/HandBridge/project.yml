name: HandBridge
options:
  bundleIdPrefix: com.handbridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  HandBridge:
    type: application
    platform: iOS
    sources:
      - path: HandBridge
    info:
      path: HandBridge/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handbridge.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
